[project]
name = "eedf"
version = "0.1.0"
description = "Document Processing App with Generative AI for Contract/Legal Data Extraction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "google-genai>=1.0.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "reportlab>=4.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
eedf = "eedf.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eedf"]
